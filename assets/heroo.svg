<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <clipPath id="nameClip">
      <rect x="36" y="70" width="800" height="70">
        <animate attributeName="width" from="0" to="800" dur="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="880" height="270" rx="22" fill="#070b16"/>
  <rect x="0" y="0" width="880" height="3" fill="url(#line)"/>
  <text x="36" y="36" fill="#7d8da3" font-family="Consolas, Courier New, monospace" font-size="12">vaibhav-singh05 / profile</text>
  <text x="36" y="78" fill="#9aa6b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">Hi. I am</text>
  <g clip-path="url(#nameClip)">
    <text x="36" y="128" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">VAIBHAV SINGH</text>
  </g>
  <text x="36" y="168" fill="#247bff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    Senior AI Software Engineer
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="168" fill="#247bff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" opacity="0">
    AI Software Engineer at Spoto.in
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.30;0.47;0.52;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="168" fill="#247bff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" opacity="0">
    Django REST + API Builder
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.55;0.72;0.77;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="168" fill="#247bff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" opacity="0">
    Python | PostgreSQL | AWS
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.80;0.97;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="204" fill="#9aa6b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">I build AI-powered, scalable backends with Python, Django REST and APIs.</text>
  <rect x="36" y="226" width="8" height="8" rx="2" fill="#247bff"/>
  <text x="52" y="235" fill="#9aa6b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Gorakhpur, Uttar Pradesh  |  Bengaluru Remote</text>
  <rect x="36" y="250" width="8" height="8" rx="2" fill="#ff354f"/>
  <text x="52" y="259" fill="#9aa6b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Spoto.in  |  Senior AI Software Engineer</text>
</svg>
